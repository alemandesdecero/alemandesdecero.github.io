<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unidad 22 · Audios</title>
<link rel="canonical" href="../#u22">
<meta http-equiv="refresh" content="0; url=../#u22">
<style>
:root{--tinta:#1a1a1a;--suave:#666;--linea:#ddd;--fondo:#fdfdfc;--caja:#fff}
@media (prefers-color-scheme:dark){
  :root{--tinta:#e8e8e6;--suave:#a0a0a0;--linea:#3a3a3a;--fondo:#161616;--caja:#1f1f1f}
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--fondo);color:var(--tinta);
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.envoltorio{max-width:760px;margin:0 auto;padding:24px 20px 80px}
header{padding:32px 0 24px;border-bottom:2px solid var(--tinta)}
h1{margin:0 0 6px;font-size:28px;line-height:1.25}
.sub{margin:0;color:var(--suave);font-size:16px}
.intro{margin:26px 0 34px;font-size:16px}
.intro p{margin:0 0 12px}
.aviso{border-left:4px solid var(--tinta);padding:12px 0 12px 16px;
  margin:22px 0;color:var(--suave);font-size:15px}
.unidad{border:1px solid var(--linea);border-radius:10px;background:var(--caja);
  margin:0 0 18px;padding:18px 20px;scroll-margin-top:16px}
.unidad h2{margin:0 0 4px;font-size:19px}
.unidad h2 .num{color:var(--suave);font-weight:400;margin-right:8px}
.unidad .fallo{margin:0 0 16px;color:var(--suave);font-size:14.5px}
.pista{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 0;border-top:1px solid var(--linea)}
.pista .nombre{flex:1 1 190px;font-size:15px}
.pista .nombre small{display:block;color:var(--suave);font-size:13px}
audio{flex:1 1 260px;width:100%;max-width:340px;height:38px}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--linea);
  color:var(--suave);font-size:14px}
.indice{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 34px}
.indice a{display:block;min-width:38px;text-align:center;padding:7px 9px;
  border:1px solid var(--linea);border-radius:7px;text-decoration:none;
  color:var(--tinta);font-size:14px}
.indice a:hover{border-color:var(--tinta)}
</style>
</head>
<body>
<div class="envoltorio">
  <p>Llevándote a los audios de la unidad 22…</p>
  <p><a href="../#u22">Si no pasa nada, toca aquí.</a></p>
</div>
</body>
</html>
